name: Adarga Well-Known Discovery Documents
description: >-
  Probe of the RFC 8615 /.well-known/ namespace on every host the Adarga record
  knows. Adarga publishes no API, so there are no API baseURL or OpenAPI
  servers[] hosts to probe; the hosts below are the registrable domain, its www
  host, and the customer support portal. Every path returned 404 (or a 301 to
  www on the apex), so no WellKnown or SecurityTxt pointer is wired into
  apis.yml — this file records a measured absence, not a served surface.
generated: '2026-09-07'
method: probed
source: >-
  Direct unauthenticated HTTPS GETs from the enrichment pipeline, 2026-09-07,
  browser User-Agent.
