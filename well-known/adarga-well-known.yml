notes:
- >-
  www.adarga.ai/.well-known/security.txt returns HTTP 404 with a JSON body
  {"message":"security.txt not found"} — Squarespace's own handler, not a
  provider-authored document.
- >-
  All other 404s on www.adarga.ai return the Squarespace HTML 404 page, so no
  path is a soft-200 false positive.
- >-
  Subdomains observed in Certificate Transparency (workbench.adarga.ai,
  demo.adarga.ai, dev.adarga.ai and similar) do not resolve in public DNS and
  were not probed further.
