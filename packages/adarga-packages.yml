name: Adarga Packages
description: >-
  First-party software packages published by Adarga. Adarga ships no public API
  and therefore no API client SDK; everything it publishes openly is internal
  platform tooling released from the github.com/adarga-ai organisation as Go
  modules. Every entry below is resolvable through proxy.golang.org, and each
  carries the version and release date the module proxy reports. Four of the six
  public repositories in the organisation are archived. No `type: SDKs` pointer
  is wired into apis.yml: none of these packages is a client library for an
  Adarga API, and claiming otherwise would credit Adarga with an SDK it does not
  publish.
