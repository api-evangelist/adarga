aid: adarga
name: Adarga
description: 'Adarga is a British artificial-intelligence software company, founded
  in London in 2016 by Rob Bassett Cross, that builds information-intelligence and
  decision-advantage software for Defence, National Security and Resilience customers.
  Its products include Adarga Vantage, an AI analysis platform that extracts, contextualises
  and connects information from millions of internal and external sources in more than
  75 languages; Adarga Augur, an alerting and intelligence tool; and Catalyst, a multidomain
  data-fusion and developer platform that the company markets as a Sovereign AI Stack.
  Adarga sells to the UK Ministry of Defence and Strategic Command and to US federal
  customers, and partners with Oracle to run Vantage on Oracle Cloud Infrastructure.
  Adarga publishes no public developer portal, API documentation, or machine-readable
  API contract; its product documentation sits behind a customer support portal.'
